<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>キーを変えて流す - ひきがたり</title>
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('hk.prefs') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="kp-body">
    <main class="kp">
      <h1 class="kp-title">原曲をこのキーで流す</h1>
      <p class="kp-song" id="song">ひきがたりで曲を開いてください</p>

      <div class="kp-key">
        <button class="step-btn" id="down" aria-label="キーを下げる">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
        <div class="kp-key-mid">
          <div class="key-now" id="key">原曲</div>
          <div class="muted small" id="keysub">&nbsp;</div>
        </div>
        <button class="step-btn" id="up" aria-label="キーを上げる">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
      </div>

      <section id="idle">
        <button class="btn btn-primary kp-start" id="start">取り込んで、このキーで流す</button>
        <ol class="kp-steps">
          <li>上のボタンを押す</li>
          <li>出てきた画面の「Chrome タブ」（Edge は「タブ」）から <b>ひきがたり</b> を選ぶ</li>
          <li>「タブの音声も共有する」がオンになっているのを確かめて「共有」</li>
        </ol>
        <p class="panel-note">取り込んでいる間は、ひきがたりのタブの元の音が消えて、この窓からキーを変えた音が流れます。音を保存したりはしません。</p>
      </section>

      <section id="live" hidden>
        <div class="kh-live kp-live" role="status"><span><i></i><b id="livetext">このキーで流しています</b></span></div>
        <div class="row-gap">
          <button class="btn" id="ab" aria-pressed="false">原曲キーと聴き比べ</button>
          <button class="btn" id="stop">やめる</button>
        </div>
        <p class="panel-note">ひきがたりの画面に戻って、歌詞やコードを押して流してください。キーはどちらの画面で変えても同じです。この窓は後ろに隠れていても大丈夫です（閉じるとやめます）。</p>
      </section>

      <p class="kh-err" id="err" role="alert" hidden></p>
      <p class="panel-note" id="note" hidden></p>
    </main>
    <script type="module" src="src/keypop.js"></script>
  </body>
</html>
