<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ひきがたり アイコンの元絵: 夕暮れから夜へ変わる空、大きな月、丘の上でギターを弾き語りする人のシルエット
       PNG は icons/render-icons.ps1 で作る(Edge で描いて縮小) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141938" />
      <stop offset="0.4" stop-color="#352d6c" />
      <stop offset="0.7" stop-color="#8f5689" />
      <stop offset="0.88" stop-color="#df8a84" />
      <stop offset="1" stop-color="#f2b081" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.56" stop-color="#fff3d6" stop-opacity="0.34" />
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moon" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#fffbf2" />
      <stop offset="1" stop-color="#ffe3b0" />
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b356f" />
      <stop offset="1" stop-color="#2b2350" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)" />

  <!-- 星 -->
  <g fill="#ffffff">
    <circle cx="150" cy="150" r="5" opacity="0.9" />
    <circle cx="300" cy="96" r="3" opacity="0.7" />
    <circle cx="880" cy="130" r="4.5" opacity="0.85" />
    <circle cx="940" cy="300" r="3" opacity="0.55" />
    <circle cx="96" cy="340" r="3.5" opacity="0.6" />
    <circle cx="700" cy="74" r="2.5" opacity="0.6" />
    <circle cx="214" cy="262" r="2.5" opacity="0.5" />
  </g>

  <!-- 月 -->
  <circle cx="540" cy="500" r="380" fill="url(#glow)" />
  <circle cx="540" cy="500" r="290" fill="url(#moon)" />

  <!-- 遠くの丘と町の灯り -->
  <path d="M0 772 C 140 738 260 744 380 762 C 520 782 640 744 780 737 C 880 732 960 744 1024 754 L1024 1024 L0 1024 Z" fill="url(#far)" />
  <g fill="#ffd38a">
    <circle cx="66" cy="792" r="4" opacity="0.9" />
    <circle cx="108" cy="784" r="3" opacity="0.7" />
    <circle cx="166" cy="798" r="3.5" opacity="0.8" />
    <circle cx="226" cy="788" r="2.5" opacity="0.6" />
    <circle cx="826" cy="770" r="3.5" opacity="0.8" />
    <circle cx="874" cy="780" r="4" opacity="0.9" />
    <circle cx="930" cy="772" r="3" opacity="0.7" />
    <circle cx="974" cy="786" r="3.5" opacity="0.8" />
  </g>

  <!-- 手前の丘と、人(頭・髪・胴・組んだ脚) -->
  <g fill="#15122c">
    <path d="M0 884 C 160 834 300 810 470 808 C 640 806 820 838 1024 902 L1024 1024 L0 1024 Z" />
    <!-- 頭(少しうつむく)と、あごまでの髪 -->
    <ellipse cx="462" cy="460" rx="45" ry="51" transform="rotate(18 462 460)" />
    <ellipse cx="450" cy="448" rx="53" ry="51" />
    <ellipse cx="426" cy="494" rx="28" ry="34" />
    <path d="M432 500 L 478 500 L 486 556 L 428 558 Z" />
    <path d="M386 574 C 398 546 484 532 522 556 C 540 600 532 660 520 704 L 534 792 L 378 798 C 372 726 372 636 386 574 Z" />
    <path d="M336 818 C 322 790 344 764 398 760 L 604 754 C 646 754 668 784 656 816 Z" />
  </g>

  <!-- ギター: ひざの上で、ネックは右上へ。胴は月の色のふちで見分ける -->
  <g transform="rotate(-22 460 705)">
    <path d="M346 705 C 346 652 380 630 420 632 C 452 634 466 652 490 652 C 512 652 522 640 550 640 C 584 640 604 670 604 705 C 604 740 584 770 550 770 C 522 770 512 758 490 758 C 466 758 452 776 420 778 C 380 780 346 758 346 705 Z" fill="#15122c" stroke="#ffe9c2" stroke-width="6" />
    <circle cx="545" cy="705" r="17" fill="#ffe9c2" opacity="0.9" />
    <rect x="598" y="694" width="262" height="22" rx="5" fill="#15122c" />
    <path d="M856 688 L 918 680 C 927 679 932 684 932 691 L 932 719 C 932 726 927 731 918 730 L 856 722 Z" fill="#15122c" />
  </g>

  <!-- 腕: 左手でネックを押さえ、右手は胴の上で弾く -->
  <g fill="none" stroke="#15122c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 582 C 530 618 560 646 600 642 C 630 640 660 628 684 614" stroke-width="30" />
    <path d="M408 586 C 378 610 358 640 364 664 C 374 690 440 700 500 686" stroke-width="32" />
  </g>
  <ellipse cx="690" cy="610" rx="20" ry="17" fill="#15122c" />

  <!-- 音符(月の前にシルエットで) -->
  <g fill="#15122c">
    <ellipse cx="660" cy="352" rx="17" ry="12.5" transform="rotate(-20 660 352)" />
    <ellipse cx="718" cy="336" rx="17" ry="12.5" transform="rotate(-20 718 336)" />
    <rect x="670" y="268" width="8" height="84" />
    <rect x="728" y="252" width="8" height="84" />
    <path d="M670 266 L 736 248 L 736 268 L 670 286 Z" />
  </g>
</svg>
