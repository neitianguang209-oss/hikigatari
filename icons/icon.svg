<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ひきがたり アイコンの元絵: くすんだ青の地に、鍵盤の上に立てかけたギターと音符ひとつ
       PNG は icons/render-icons.ps1 で作る(Edge で描いて縮小) -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#7f9fbd" />
      <stop offset="1" stop-color="#4a6788" />
    </radialGradient>
    <radialGradient id="top" cx="-30" cy="0" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2dcb4" />
      <stop offset="0.75" stop-color="#e2bd86" />
      <stop offset="1" stop-color="#c39258" />
    </radialGradient>
    <linearGradient id="keys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f2" />
      <stop offset="1" stop-color="#e7e0d3" />
    </linearGradient>
    <path id="body" d="M0 -290 C 92 -290 160 -258 160 -172 C 160 -104 120 -72 122 -30 C 124 12 206 42 206 142 C 206 262 122 332 0 332 C -122 332 -206 262 -206 142 C -206 42 -124 12 -122 -30 C -120 -72 -160 -104 -160 -172 C -160 -258 -92 -290 0 -290 Z" />
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- 鍵盤 -->
  <rect x="0" y="770" width="1024" height="16" fill="#2c3f58" opacity="0.5" />
  <rect x="0" y="782" width="1024" height="242" fill="url(#keys)" />
  <g stroke="#b9b0a0" stroke-width="4">
    <line x1="128" y1="782" x2="128" y2="1024" /><line x1="256" y1="782" x2="256" y2="1024" />
    <line x1="384" y1="782" x2="384" y2="1024" /><line x1="512" y1="782" x2="512" y2="1024" />
    <line x1="640" y1="782" x2="640" y2="1024" /><line x1="768" y1="782" x2="768" y2="1024" />
    <line x1="896" y1="782" x2="896" y2="1024" />
  </g>
  <g fill="#26303d">
    <rect x="98" y="782" width="60" height="140" rx="6" /><rect x="226" y="782" width="60" height="140" rx="6" />
    <rect x="482" y="782" width="60" height="140" rx="6" /><rect x="610" y="782" width="60" height="140" rx="6" />
    <rect x="738" y="782" width="60" height="140" rx="6" />
  </g>

  <!-- ギターの影 -->
  <g transform="translate(566 548) rotate(14) scale(0.68) translate(0 275)" opacity="0.4" filter="url(#shadow)">
    <g transform="translate(30 30)">
      <use href="#body" fill="#1d3049" />
      <rect x="-30" y="-890" width="60" height="620" fill="#1d3049" />
    </g>
  </g>
  <!-- ギター -->
  <g transform="translate(546 528) rotate(14) scale(0.68) translate(0 275)">
    <use href="#body" fill="#7a4a26" transform="translate(-14 10)" />
    <use href="#body" fill="url(#top)" />
    <circle cx="0" cy="-110" r="80" fill="none" stroke="#a9713e" stroke-width="10" />
    <circle cx="0" cy="-110" r="62" fill="#3a2414" />
    <rect x="-80" y="158" width="160" height="34" rx="12" fill="#4a2c18" />
    <path d="M-24 -724 L 24 -724 L 30 -190 L -30 -190 Z" fill="#4a2c18" />
    <path d="M-25 -722 L -36 -800 C -40 -846 -38 -880 -20 -892 C -8 -886 8 -886 20 -892 C 38 -880 40 -846 36 -800 L 25 -722 Z" fill="#4a2c18" />
    <g stroke="#f6ecd8" stroke-width="2.4" opacity="0.75">
      <line x1="-15" y1="-722" x2="-21" y2="170" /><line x1="-5" y1="-722" x2="-7" y2="170" />
      <line x1="5" y1="-722" x2="7" y2="170" /><line x1="15" y1="-722" x2="21" y2="170" />
    </g>
  </g>

  <!-- 音符 -->
  <g fill="#f8f1e4" transform="translate(250 430) rotate(-8)">
    <ellipse cx="0" cy="0" rx="40" ry="30" transform="rotate(-22)" />
    <rect x="22" y="-196" width="16" height="194" rx="4" />
    <path d="M38 -196 C 76 -170 92 -132 76 -92 C 84 -126 66 -150 38 -156 Z" />
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay" />
</svg>
